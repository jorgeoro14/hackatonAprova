[project]
name = "aprova-process-agent"
version = "0.1.0"
description = "Intent-driven municipal process change interview"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "pydantic>=2.7,<3",
  "langsmith>=0.3,<1",
  "jsonschema[format]>=4.23,<5",
  "referencing>=0.36,<1",
]

[project.optional-dependencies]
rag = ["langchain-chroma>=1.0,<2", "pypdf>=6,<7", "python-docx>=1.2,<2"]
requirements = ["langgraph-checkpoint-sqlite>=3.1.2,<4"]
studio = ["langgraph-cli[inmem]>=0.4.38,<0.5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
markers = [
  "phase0: document loading, chunking and persistent index checks",
  "phase1: vector retrieval and reference-document metrics",
  "phase2: retrieval experiment comparison and reports",
  "phase3: agentic RAG grading, rewriting, citations and abstention",
]

[tool.ruff]
target-version = "py311"
line-length = 100
